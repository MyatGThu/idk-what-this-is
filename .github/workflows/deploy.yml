name: Build and deploy to Pages

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Also the front-matter validation step: a malformed prompt file fails here.
      - name: Build site
        run: node scripts/build.mjs

      # enablement asks the action to create the Pages site itself. It only
      # succeeds with a token that has admin rights on the repository — the
      # default GITHUB_TOKEN does not, and returns "Resource not accessible by
      # integration". Pages must therefore be enabled once under
      # Settings -> Pages -> Source -> GitHub Actions; see the README.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
